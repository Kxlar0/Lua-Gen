<!DOCTYPE html>
<html>
  <head>
    <title>Manifest & Lua Generator</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      var segmentCount = 0;
      var l = window.location;
      if (l.hostname === 'github.io') {
        if (l.pathname.split("/").length > 2) {
          segmentCount = l.pathname.split("/").length - 2;
        }
      }
      sessionStorage.redirect = l.pathname;
      l.replace(l.origin + '/?' + l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~'));
    </script>
  </head>
  <body>
  </body>
</html>
